name: deploy

# A push to main deploys the web build to the Cloudflare Pages project
# `mood-read` (https://mood-read.pages.dev). The commit hash is what
# `pnpm deploy:check` matches (scripts/deploy-check.mjs), so it is passed
# to wrangler explicitly. Spec: plan/02-bootstrap.md, chunk 02.3.
#
# Secrets (GitHub Actions, pushed from the vault with
# `node scripts/secrets.mjs push NAME --to github-actions`):
#   CLOUDFLARE_API_TOKEN   needs Cloudflare Pages: Edit on the account
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push waits rather than racing an older one.
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Build the web export
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name mood-read --branch main --commit-hash "$GITHUB_SHA"
