name: setup
description: >-
  The project's toolchain for a cloud tick: one place for it, used
  by march.yml's owner job and its pull-request build job alike
  (and night.yml). Adjust for your stack; keep it free of secrets.

runs:
  using: composite
  steps:
    # ───────────────────────────────────────────────────────────
    # Project-specific install. Adjust for your stack.
    # ───────────────────────────────────────────────────────────
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The Playwright e2e leg arrives with chunk 02.2 (chunk 02.2):
    # one root package, its config at playwright.config.ts. Both steps
    # skip until that file exists.
    - name: Cache Playwright browsers
      if: hashFiles('playwright.config.ts') != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers (chromium only)
      if: hashFiles('playwright.config.ts') != ''
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
