<!doctype html>
<html lang="en">
<head>

<title>Mood Read — layout option B</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#f2f2f2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#111;}
header.page{height:96px;padding:14px 32px;border-bottom:2px solid #111;
  display:flex;flex-direction:column;justify-content:center;background:#fff;}
header.page h1{margin:0 0 4px;font-size:21px;letter-spacing:.2px;}
header.page p{margin:0;font-size:12.5px;color:#555;max-width:1000px;line-height:16px;
  height:32px;overflow:hidden;}
.board{display:flex;flex-direction:row;flex-wrap:nowrap;gap:36px;padding:32px;
  align-items:flex-start;width:max-content;}
figure.frame{margin:0;width:390px;display:flex;flex-direction:column;align-items:center;}
figcaption{margin-top:10px;height:36px;line-height:18px;font-size:12.5px;font-weight:600;
  text-align:center;overflow:hidden;color:#111;}
.phone{width:390px;height:844px;border:3px solid #111;border-radius:34px;background:#fff;
  overflow:hidden;position:relative;display:flex;flex-direction:column;}
.statusbar{flex:0 0 22px;height:22px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:10.5px;font-weight:600;border-bottom:1px solid #111;}
.screen{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;}
.pad{padding:14px 16px;}
h2.scr-title{margin:0 0 10px;font-size:15px;font-weight:700;}
h3.scr-sub{margin:0 0 8px;font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.5px;}
.muted{color:#777;}
.cover{background:repeating-linear-gradient(135deg,#ddd 0 6px,#f3f3f3 6px 12px);
  border:1.5px solid #111;border-radius:6px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10px;font-weight:700;color:#222;padding:4px;}
.row{display:flex;align-items:center;gap:10px;}
.hr{border-top:1px solid #ccc;}
.btn{border:1.5px solid #111;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;
  text-align:center;background:#fff;}
.btn.primary{background:#111;color:#fff;}
.chip{display:inline-block;border:1.3px solid #111;border-radius:14px;padding:3px 9px;font-size:10.5px;
  font-weight:600;margin:0 4px 4px 0;background:#fff;}
.chip.ghost{border-style:dashed;color:#999;border-color:#aaa;}
.bar-track{height:8px;border:1px solid #111;border-radius:4px;background:#eee;overflow:hidden;}
.bar-fill{height:100%;background:#111;}
.navtabs{flex:0 0 54px;border-top:1px solid #111;display:flex;}
.navtabs div{flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.navtabs div.active{color:#111;}
.navtabs div:not(.active){color:#999;}
.topbar{flex:0 0 44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #111;font-size:13px;font-weight:700;}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e5e5e5;}
.lock-time{font-size:46px;font-weight:300;text-align:center;margin:30px 0 4px;}
.lock-date{font-size:12px;text-align:center;color:#444;margin-bottom:26px;}
.backdrop-dim{position:absolute;inset:0;background:rgba(0,0,0,.35);}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #111;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;}
.sheet .handle{width:40px;height:4px;background:#bbb;border-radius:2px;margin:8px auto 4px;}
.collage-card{position:absolute;border:1.6px solid #111;border-radius:12px;background:#fff;
  box-shadow:3px 4px 0 rgba(0,0,0,0.08);}
.dots{display:flex;gap:5px;align-items:center;justify-content:center;}
.dots span{width:6px;height:6px;border-radius:50%;background:#ccc;display:inline-block;}
.dots span.on{background:#111;}
.lock-ico{display:inline-block;width:9px;height:8px;border:1.4px solid #111;border-radius:1.5px;
  position:relative;vertical-align:middle;margin-right:2px;background:#fff;}
.lock-ico::before{content:"";position:absolute;left:0.5px;top:-6px;width:5.5px;height:6px;
  border:1.4px solid #111;border-bottom:none;border-radius:5px 5px 0 0;}
.pause-ico{display:inline-block;width:11px;height:13px;position:relative;vertical-align:middle;}
.pause-ico::before,.pause-ico::after{content:"";position:absolute;top:0;width:3.5px;height:13px;background:#111;}
.pause-ico::before{left:0;}
.pause-ico::after{right:0;}
.mini-player{flex:0 0 64px;border-top:1.5px solid #111;display:flex;align-items:center;gap:10px;padding:0 12px;}
.river-row{border-bottom:1px solid #e3e3e3;padding:10px 14px;}
.river-row.expanded{background:#fafafa;border-left:4px solid #111;padding-left:10px;}
</style>
</head>

  <p>A book is a vertical stream of its chapters. The playing chapter (Ch.7) expands in place with its moods, named piece and mixer shown inline — never a sheet — and a mini player stays docked at the bottom. Moods are the spine of the screen.</p>
</header>
